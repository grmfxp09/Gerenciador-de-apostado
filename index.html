<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Resultados</title>
<style>
:root{
  --bg:#0a0b0f;
  --card:#12151c;
  --card2:#171b24;
  --text:#f7f8fb;
  --muted:#8f98a8;
  --line:#242a35;
  --green:#2ed573;
  --red:#ff4757;
  --blue:#5b8cff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at top,#161b25 0,#0a0b0f 38%,#090a0d 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
}
.app{
  max-width:560px;
  margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.title{font-size:26px;font-weight:850;letter-spacing:-.6px}
.subtitle{font-size:13px;color:var(--muted);margin-top:3px}
.badge{
  background:#1b2030;
  border:1px solid #2a3242;
  padding:8px 11px;
  border-radius:999px;
  color:#b9c3d5;
  font-size:12px;
  font-weight:700;
}
.summary{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:12px;
  margin-bottom:14px;
}
.card{
  background:linear-gradient(180deg,#151923,#11141b);
  border:1px solid var(--line);
  box-shadow:0 12px 35px rgba(0,0,0,.28);
  border-radius:20px;
}
.total{
  padding:18px;
  min-height:118px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.small{font-size:13px;color:var(--muted)}
.amount{
  font-size:32px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}
.count{
  padding:18px;
  min-height:118px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.count .num{font-size:32px;font-weight:900}
.entry{padding:16px;margin-bottom:14px}
.inputWrap{
  background:#0d1016;
  border:1px solid #252b36;
  border-radius:16px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}
.currency{font-size:20px;color:#c8d0dd;font-weight:700}
input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:27px;
  font-weight:850;
}
input::placeholder{color:#545d6c}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}
button{
  border:0;
  border-radius:15px;
  padding:15px 10px;
  font-size:15px;
  font-weight:850;
  color:white;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.985)}
.negativeBtn{
  background:linear-gradient(180deg,#ff5967,#e53a49);
  box-shadow:0 8px 20px rgba(255,71,87,.18);
}
.positiveBtn{
  background:linear-gradient(180deg,#3add80,#20bc63);
  box-shadow:0 8px 20px rgba(46,213,115,.18);
}
.sectionHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 16px 9px;
}
.sectionTitle{font-size:16px;font-weight:850}
.clear{
  width:auto;
  background:transparent;
  color:#8993a3;
  padding:7px 8px;
  font-size:12px;
}
.history{overflow:hidden}
.list{padding:0 12px 10px}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:13px 4px;
  border-top:1px solid var(--line);
}
.item:first-child{border-top:0}
.left{min-width:0}
.mainline{font-size:15px;font-weight:800}
.time{font-size:12px;color:var(--muted);margin-top:4px}
.value{
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
}
.pos{color:var(--green)}
.neg{color:var(--red)}
.empty{
  padding:24px 10px 30px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(25px);
  background:#1b2029;
  border:1px solid #313846;
  border-radius:999px;
  padding:10px 14px;
  color:white;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:390px){
  .amount,.count .num{font-size:28px}
  .title{font-size:23px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="title">Meus Resultados</div>
      <div class="subtitle">Controle simples e rápido</div>
    </div>
    <div class="badge">SALVO NO CELULAR</div>
  </div>

  <div class="summary">
    <div class="card total">
      <div class="small">Total acumulado</div>
      <div id="total" class="amount">R$ 0,00</div>
    </div>
    <div class="card count">
      <div class="small">Registros</div>
      <div id="count" class="num">0</div>
    </div>
  </div>

  <div class="card entry">
    <div class="small">Valor do registro</div>
    <div class="inputWrap">
      <span class="currency">R$</span>
      <input id="value" inputmode="decimal" autocomplete="off" placeholder="10,50">
    </div>
    <div class="actions">
      <button class="negativeBtn" onclick="addResult(-1)">Resultado negativo</button>
      <button class="positiveBtn" onclick="addResult(1)">Resultado positivo</button>
    </div>
  </div>

  <div class="card history">
    <div class="sectionHeader">
      <div class="sectionTitle">Histórico</div>
      <button class="clear" onclick="clearAll()">Limpar</button>
    </div>
    <div id="list" class="list"></div>
  </div>
</div>

<div id="toast" class="toast">Registro adicionado</div>

<script>
const KEY="resultado_tracker_v2";
let records=[];
try{ records=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ records=[]; }

const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

function parseValue(txt){
  txt=String(txt).trim().replace(/\s/g,"");
  if(!txt) return NaN;
  if(txt.includes(",") && txt.includes(".")){
    txt=txt.replace(/\./g,"").replace(",",".");
  } else if(txt.includes(",")){
    txt=txt.replace(",",".");
  }
  return Number(txt);
}

function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify(records)); }catch(e){}
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1200);
}

function addResult(direction){
  const inp=document.getElementById("value");
  const value=parseValue(inp.value);
  if(!Number.isFinite(value) || value<=0){
    showToast("Digite um valor válido");
    inp.focus();
    return;
  }

  const amount = direction===1 ? value : -value;

  records.unshift({
    amount,
    kind: direction===1 ? "positivo" : "negativo",
    date: new Date().toISOString()
  });

  persist();
  inp.value="";
  render();
  showToast("Registro adicionado");
}

function removeAt(index){
  records.splice(index,1);
  persist();
  render();
}

function clearAll(){
  if(!records.length) return;
  if(confirm("Apagar todo o histórico?")){
    records=[];
    persist();
    render();
  }
}

function render(){
  const total=records.reduce((s,r)=>s+r.amount,0);
  const totalEl=document.getElementById("total");
  totalEl.textContent=brl(total);
  totalEl.className="amount "+(total>0?"pos":total<0?"neg":"");
  document.getElementById("count").textContent=records.length;

  const list=document.getElementById("list");
  if(!records.length){
    list.innerHTML='<div class="empty">Nenhum registro ainda.</div>';
    return;
  }

  list.innerHTML=records.map((r,i)=>{
    const d=new Date(r.date);
    const when=d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    const cls=r.amount>=0?"pos":"neg";
    const sign=r.amount>=0?"+":"−";
    const abs=brl(Math.abs(r.amount));
    const label=r.amount>=0?"Resultado positivo":"Resultado negativo";
    return `
      <div class="item" onclick="if(confirm('Excluir este registro?')) removeAt(${i})">
        <div class="left">
          <div class="mainline">${label}</div>
          <div class="time">${when} • toque para excluir</div>
        </div>
        <div class="value ${cls}">${sign}${abs}</div>
      </div>`;
  }).join("");
}

document.getElementById("value").addEventListener("keydown",e=>{
  if(e.key==="Enter") addResult(1);
});

render();
</script>
</body>
</html>
